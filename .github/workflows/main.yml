name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # must include the engines floor from package.json
        node-version:
          - 20.19.0
          - lts/*
    steps:
      - uses: actions/checkout@v3.3.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint "{src,__tests__}/**/*.ts"
      - run: pnpm exec prettier --check "{src,__tests__}/**/*.ts"
      - run: pnpm build
      - run: pnpm test
